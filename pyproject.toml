[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometria-genai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bibtexparser==1.4.1",
    "python-Levenshtein==0.25.1",
    "pandas==2.2.3",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "streamlit>=1.35.0",
    "plotly>=5.24.0",
    "requests>=2.32.0",
    "nltk>=3.9.0",
    "wordcloud>=1.9.0",
    "fpdf2>=2.8.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "kaleido>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
