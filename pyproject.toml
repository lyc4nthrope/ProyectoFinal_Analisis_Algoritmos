[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometria-genai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bibtexparser==1.4.1",
    "python-Levenshtein==0.25.1",
    "unidecode==1.3.8",
    "pandas==2.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
